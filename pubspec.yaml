name: catat_nota
description: Aplikasi pembukuan - foto struk/nota, OCR on-device, export ke Excel dan Google Sheets.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Penyimpanan lokal
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Kamera, galeri, crop, kompres
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1

  # OCR (Android: ML Kit; iOS: Apple Vision lewat MethodChannel, lihat ios/Runner/VisionOcr.swift)
  google_mlkit_text_recognition: ^0.14.0

  # Excel + berbagi file
  excel: ^4.0.6
  file_picker: ^8.1.6
  share_plus: ^10.1.4

  # Google Sheets (OAuth 2.0 - tanpa service account)
  google_sign_in: ^6.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

  # Utilitas
  connectivity_plus: ^6.1.0
  intl: any
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false
