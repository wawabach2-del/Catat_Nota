name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q catat_nota.zip
          cp -r catat_nota/. .
          rm -rf catat_nota catat_nota.zip .github/workflows/build.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add project"
          git push
